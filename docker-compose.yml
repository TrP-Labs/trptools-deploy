name: trptools

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trptools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env — run ./scripts/setup.sh}
      POSTGRES_DB: trptools
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trptools -d trptools']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run ./scripts/setup.sh}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?run ./scripts/setup.sh}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?run ./scripts/setup.sh}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-trptools}
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'bucket', 'info', '${S3_BUCKET:-trptools}']
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    image: dxflrs/garage:v2.3.0
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ['/garage']
    command: ['bucket', 'website', '--allow', '${S3_BUCKET:-trptools}']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run ./scripts/setup.sh}
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    restart: 'no'

  images:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      garage-init:
        condition: service_completed_successfully
    environment:
      S3_BUCKET: ${S3_BUCKET:-trptools}
    volumes:
      - ./storage/images.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '9000:8080'

  backend:
    image: ghcr.io/trp-labs/trptools-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://trptools:${POSTGRES_PASSWORD}@postgres:5432/trptools
      REDIS_URL: redis://valkey:6379
      BASE_URL: ${BASE_URL:?set in .env}
      FRONTEND_URL: ${FRONTEND_URL:?set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env — run ./scripts/setup.sh}
      ROBLOX_CLIENT_ID: ${ROBLOX_CLIENT_ID:-}
      ROBLOX_CLIENT_SECRET: ${ROBLOX_CLIENT_SECRET:-}
      ROBLOX_API_KEY: ${ROBLOX_API_KEY:-}
      SITE_ADMINS: ${SITE_ADMINS:-}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:-}
      BOT_WORKER_URL: ${BOT_WORKER_URL:-}
      BOT_WORKER_SYNC_TOKEN: ${BOT_WORKER_SYNC_TOKEN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set in .env}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-trptools}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - '3001:3001'

  frontend:
    image: ghcr.io/trp-labs/trptools-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: '3000'
      ORIGIN: ${FRONTEND_URL:?set in .env}
      PUBLIC_API_URL: ${BASE_URL:?set in .env}
      INTERNAL_API_URL: http://backend:3001
      POLICIES_REPOSITORY: ${POLICIES_REPOSITORY:-TrP-Labs/Policies}
      POLICIES_REF: ${POLICIES_REF:-main}
      POLICIES_GITHUB_TOKEN: ${POLICIES_GITHUB_TOKEN:-}
    ports:
      - '3000:3000'

  bot:
    image: ghcr.io/trp-labs/trptools-bot:${TAG:-latest}
    profiles: ['bot']
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      API_URL: http://backend:3001
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:-}
      REDIS_URL: redis://valkey:6379

volumes:
  postgres-data:
  valkey-data:
  garage-data:
